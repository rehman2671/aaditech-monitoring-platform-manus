name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: sentinelpulse_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinelpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Go Backend Tests
        run: |
          cd backend/go
          go test -v ./...

  frontend-matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || npm install

      - name: Run TypeScript Check
        run: pnpm check || npx tsc --noEmit

      - name: Run Vitest Unit, Integration & Acceptance Tests
        run: pnpm test

  windows-agent-verification:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build C# Windows Agent
        run: |
          cd agent/src/SentinelPulse.Agent
          dotnet restore
          dotnet build -c Release

      - name: Install WiX v4 Global Tool
        run: dotnet tool install --global wix --version 4.0.4

      - name: Validate WiX Installer Source
        run: |
          cd agent/packaging
          wix extension add WixToolset.NetFx.wixext
          wix source inspect sentinelpulse-agent.wxs

  smoke-test-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Verify Smoke Test Script
        run: |
          bash -n scripts/smoke_test.sh
          echo "Smoke test script syntax is valid."
