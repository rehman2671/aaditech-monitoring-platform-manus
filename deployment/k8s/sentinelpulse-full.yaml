apiVersion: v1
kind: Namespace
metadata:
  name: sentinelpulse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelpulse-postgres
  namespace: sentinelpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelpulse-postgres
  template:
    metadata:
      labels:
        app: sentinelpulse-postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: sentinelpulse
        - name: POSTGRES_USER
          value: sentinel
        - name: POSTGRES_PASSWORD
          value: secure_postgres_password_change_me
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "500m"
            memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelpulse-redis
  namespace: sentinelpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelpulse-redis
  template:
    metadata:
      labels:
        app: sentinelpulse-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: "100m"
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelpulse-backend
  namespace: sentinelpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelpulse-backend
  template:
    metadata:
      labels:
        app: sentinelpulse-backend
    spec:
      containers:
      - name: backend
        image: sentinelpulse/backend:v2.4.1
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: postgres://sentinel:secure_postgres_password_change_me@sentinelpulse-postgres:5432/sentinelpulse?sslmode=disable
        - name: REDIS_URL
          value: redis://sentinelpulse-redis:6379/0
        - name: JWT_SECRET
          value: production_jwt_secret_change_me_32_bytes_min
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelpulse-dashboard
  namespace: sentinelpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelpulse-dashboard
  template:
    metadata:
      labels:
        app: sentinelpulse-dashboard
    spec:
      containers:
      - name: dashboard
        image: sentinelpulse/dashboard:v2.4.1
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelpulse-dashboard-svc
  namespace: sentinelpulse
spec:
  selector:
    app: sentinelpulse-dashboard
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
