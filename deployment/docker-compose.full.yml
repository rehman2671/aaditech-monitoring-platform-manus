version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: sentinelpulse_db
    environment:
      POSTGRES_DB: sentinelpulse
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: secure_postgres_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelpulse_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend/go
      dockerfile: Dockerfile
    container_name: sentinelpulse_backend
    environment:
      - DATABASE_URL=postgres://sentinel:secure_postgres_password_change_me@postgres:5432/sentinelpulse?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=production_jwt_secret_change_me_32_bytes_min
      - PORT=8080
      - PROCESS_SAMPLE_RETENTION_DAYS=${PROCESS_SAMPLE_RETENTION_DAYS:-30}
      - LLM_PROVIDER=${LLM_PROVIDER:-disabled}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:1.7b}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-8000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: sentinelpulse_dashboard
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
