<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400&display=swap');
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { 
        width: 1280px; 
        min-height: 720px; 
        background: #F4F7FA; 
        font-family: 'Inter', sans-serif;
        color: #425466;
        position: relative;
        overflow: hidden;
      }
      .grid-bg {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        z-index: 0;
        pointer-events: none;
      }
      .grid-line {
        border-right: 1px solid rgba(0, 102, 255, 0.05);
      }
      .content {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        padding: 80px;
        height: 100%;
      }
      .title-block {
        grid-column: 1 / span 10;
        border: 2px solid #0A2540;
        padding: 40px;
        background: white;
        margin-top: 40px;
      }
      h1 {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 56px;
        color: #0A2540;
        line-height: 1.1;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .subtitle {
        font-size: 24px;
        color: #425466;
        max-width: 800px;
        line-height: 1.5;
      }
      .accent-block {
        grid-column: 1 / span 2;
        height: 12px;
        background: #0066FF;
        margin-top: 40px;
      }
      .meta {
        grid-column: 1 / span 12;
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: #0A2540;
        border-top: 1px dashed #425466;
        padding-top: 20px;
      }
      .icon-badge {
        position: absolute;
        top: 80px;
        right: 80px;
        width: 100px;
        height: 100px;
        border: 2px solid #0A2540;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
      }
      .icon-badge i {
        font-size: 48px;
        color: #0066FF;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-bg">
            <div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div>
            <div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div>
            <div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div>
        </div>
        <div class="icon-badge">
            <i class="fas fa-shield-alt"></i>
        </div>
        <div class="content">
            <div class="title-block">
                <h1>SentinelPulse Windows MSI Packaging & Service Deployment Architecture</h1>
                <p class="subtitle">Enterprise Windows Fleet Monitoring Demands Native Service Architecture and Unattended MSI Deployment</p>
            </div>
            <div class="accent-block"></div>
            <div class="meta">
                <span>VERSION: 2.4.1 (LTS)</span>
                <span>SYSTEM: SENTINELPULSE-MSI-CORE</span>
                <span>CLASSIFICATION: ARCHITECTURAL SPECIFICATION</span>
            </div>
        </div>
    </div>
</body>
</html>
